name: release

on:
  push:
    branches: [main]
  # Lets a failed publish be retried: the committed version is built and published
  # if it isn't on npm yet.
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Required for npm OIDC trusted publishing (no long-lived tokens).
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted publishing needs npm >= 11.5.1; don't rely on the bundled version.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build

      - name: Cut release (version, changelog, tag, GitHub Release)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Published via OIDC trusted publishing — npm CLI mints a short-lived
      # credential for this workflow run. No NPM_TOKEN needed.
      # Requires a one-time manual first publish + trusted publisher configured
      # on npmjs.com (see README). Skips cleanly when there is no new version
      # (e.g. chore-only pushes that cut no release).
      - name: Publish package to npm via OIDC
        run: |
          VERSION=$(node -p "require('./dist/newang/package.json').version")
          echo "dist version: '${VERSION}'"
          if [ -z "${VERSION}" ]; then
            echo "Could not resolve the dist version — refusing to publish blind." >&2
            exit 1
          fi
          if npm view "newang@${VERSION}" version >/dev/null 2>&1; then
            echo "newang@${VERSION} is already on npm — skipping publish."
          else
            echo "Publishing newang@${VERSION}…"
            npm publish ./dist/newang --provenance --tag latest
          fi
